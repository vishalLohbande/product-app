
name: Spring Boot CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # 3. Build Spring Boot application
      - name: Maven Build
        run: mvn -B clean package -DskipTests

      # 4. Login to Docker Hub
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build and Push Docker Image
      - name: Build and Push Image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/product-app"

          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${GITHUB_SHA}" .

          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA}"

      # 6. Deploy to AWS EC2 using Docker Compose
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu

            # Verify files
            test -f docker-compose.yml
            test -f .env

            # Pull latest Product image
            docker compose pull perfume-app

            # Update only Product application
            docker compose up -d --no-deps perfume-app

            # Verify containers
            docker ps

            # Show Product application logs
            docker logs --tail 50 product-container
